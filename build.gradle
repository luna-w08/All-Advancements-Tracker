plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}
repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}
loom {
    splitEnvironmentSourceSets()
    mods {
        "aaigttracker" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

def regressionClasses = layout.buildDirectory.dir('classes/java/trackerVerification')
tasks.register('compileTrackerVerification', JavaCompile) {
    dependsOn tasks.named('clientClasses')
    source = fileTree('src/verification/java') { include '**/*.java' }
    classpath = sourceSets.client.runtimeClasspath
    destinationDirectory = regressionClasses
}
tasks.register('verifyTrackerRegressions', JavaExec) {
    dependsOn tasks.named('compileTrackerVerification')
    classpath = files(regressionClasses) + sourceSets.client.runtimeClasspath
    mainClass = 'dev.milow.aaigttracker.verification.TrackerRegressions'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn tasks.named('verifyTrackerRegressions') }
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Jar).configureEach {
    from('LICENSE')
}

def java25Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(net.fabricmc.loom.task.RunGameTask).configureEach {
    javaLauncher = java25Launcher
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
